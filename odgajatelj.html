<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vrtićko doba - Evidencija za odgajateljice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
            font-size: 1.8rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        /* Prijava */
        .login-card { max-width: 450px; margin: 40px auto; text-align: center; }

        .login-card h2 { color: #333; margin-bottom: 20px; }

        .login-card label { display: block; text-align: left; color: #666; margin-bottom: 8px; font-weight: 600; }

        .login-card select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover { transform: translateY(-2px); }

        .btn-logout {
            background: #ff4757;
            padding: 8px 18px;
            font-size: 0.9rem;
        }

        /* Header nakon prijave */
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .user-info h2 { color: #333; font-size: 1.2rem; }
        .user-info p { color: #999; font-size: 0.9rem; }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .user-info-left { display: flex; align-items: center; gap: 15px; }

        /* Tablica */
        .mjesec-select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }

        thead th {
            background: #667eea;
            color: white;
            padding: 8px 4px;
            text-align: center;
            min-width: 46px;
        }

        thead th:first-child { min-width: 90px; text-align: left; padding-left: 12px; }

        tbody td { padding: 6px 4px; border-bottom: 1px solid #eee; text-align: center; }

        .vrijeme-cell {
            display: inline-block;
            min-width: 42px;
            padding: 4px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .vrijeme-cell.ima { background: #2ed573; color: white; }
        .vrijeme-cell.odsutan { background: #ff4757; color: white; }
        .vrijeme-cell.prazno { background: #eee; color: #999; }

        .info-box {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 12px 15px;
            border-radius: 6px;
            color: #555;
            font-size: 0.85rem;
            margin-top: 15px;
        }

        .row-label {
            text-align: left;
            padding-left: 12px !important;
            font-weight: 700;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧑‍🏫 Evidencija radnog vremena</h1>

        <!-- Prijava -->
        <div class="card login-card" id="login-card">
            <h2>Prijava odgajateljice</h2>
            <label for="vrtic-select">Odaberite vrtić:</label>
            <select id="vrtic-select" onchange="ucitajOdgajatelje()">
                <option value="">-- Odaberite vrtić --</option>
            </select>
            <label for="odgajatelj-select">Odaberite svoje ime:</label>
            <select id="odgajatelj-select">
                <option value="">-- Prvo odaberite vrtić --</option>
            </select>
            <button class="btn" onclick="prijava()">Prijava</button>
        </div>

        <!-- Nakon prijave -->
        <div id="app" style="display:none;">
            <div class="card">
                <div class="user-header">
                    <div class="user-info-left">
                        <div class="avatar" id="avatar">?</div>
                        <div class="user-info">
                            <h2 id="user-ime"></h2>
                            <p id="user-detalji"></p>
                        </div>
                    </div>
                    <button class="btn btn-logout" onclick="odjava()">Odjava</button>
                </div>
            </div>

            <div class="card">
                <label style="color:#666; font-weight:600; margin-right:10px;">Mjesec:</label>
                <select class="mjesec-select" id="mjesec">
                    <option>Rujan</option><option>Listopad</option><option>Studeni</option><option>Prosinac</option>
                    <option>Siječanj</option><option>Veljača</option><option>Ožujak</option><option>Travanj</option>
                    <option>Svibanj</option><option>Lipanj</option><option>Srpanj</option><option>Kolovoz</option>
                </select>
                <div style="overflow-x:auto;">
                    <table id="tablica">
                        <thead id="thead"></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                <div class="info-box">
                    💡 Klikom na dan unosite brojke za vrijeme (npr. <strong>730</strong> → 07:30). Prazno = "-" (odsutan), "x" = brisanje.
                    Možete uređivati <strong>samo svoje</strong> vrijeme dolaska i odlaska.
                </div>
            </div>

            <div class="card">
                <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:15px; margin-bottom:15px;">
                    <h2 style="color:#333; font-size:1.1rem;">🖼️ Fotografije</h2>
                    <label class="btn" style="cursor:pointer;">
                        📤 Učitaj fotografije
                        <input type="file" accept="image/*" multiple style="display:none;" onchange="ucitajFotografije(event)">
                    </label>
                </div>
                <div id="galerija" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:15px;"></div>
            </div>
        </div>
    </div>

    <script>
        // Zajednički podaci (u stvarnoj aplikaciji dolazili bi s poslužitelja)
        const vrtici = [
            { id: 1, naziv: 'DV Sunce', odgajatelji: [
                { id: 1, ime: 'Marija', prezime: 'Horvat', radnoMjesto: 'Odgojiteljica' },
                { id: 2, ime: 'Ivana', prezime: 'Kovač', radnoMjesto: 'Odgojiteljica' }
            ]},
            { id: 2, naziv: 'DV Radost', odgajatelji: [
                { id: 3, ime: 'Ana', prezime: 'Marić', radnoMjesto: 'Odgojiteljica' },
                { id: 4, ime: 'Sanja', prezime: 'Perić', radnoMjesto: 'Odgojiteljica' }
            ]},
            { id: 3, naziv: 'DV Cvrčak', odgajatelji: [
                { id: 5, ime: 'Martina', prezime: 'Stanić', radnoMjesto: 'Odgojiteljica' }
            ]}
        ];

        let prijavljeni = null;
        let prijavljeniVrtic = null;

        // Podaci se spremaju po korisniku u localStorage
        function kljucKorisnika(odgId) { return `evidencija_odg_${odgId}`; }

        function ucitajPodatkeKorisnika(odgId) {
            const spremljeno = localStorage.getItem(kljucKorisnika(odgId));
            if (spremljeno) return JSON.parse(spremljeno);
            return { dolasci: new Array(31).fill(''), odlasci: new Array(31).fill('') };
        }

        function spremiPodatkeKorisnika(odgId, podaci) {
            localStorage.setItem(kljucKorisnika(odgId), JSON.stringify(podaci));
        }

        // Init prijava
        function initPrijava() {
            const sel = document.getElementById('vrtic-select');
            vrtici.forEach(v => {
                const o = document.createElement('option');
                o.value = v.id;
                o.textContent = v.naziv;
                sel.appendChild(o);
            });
        }

        function ucitajOdgajatelje() {
            const vrticId = parseInt(document.getElementById('vrtic-select').value, 10);
            const sel = document.getElementById('odgajatelj-select');
            sel.innerHTML = '<option value="">-- Odaberite svoje ime --</option>';
            const vrtic = vrtici.find(v => v.id === vrticId);
            if (!vrtic) return;
            vrtic.odgajatelji.forEach(o => {
                const opt = document.createElement('option');
                opt.value = o.id;
                opt.textContent = `${o.ime} ${o.prezime}`;
                sel.appendChild(opt);
            });
        }

        function prijava() {
            const vrticId = parseInt(document.getElementById('vrtic-select').value, 10);
            const odgId = parseInt(document.getElementById('odgajatelj-select').value, 10);
            if (!vrticId || !odgId) { alert('Odaberite vrtić i svoje ime.'); return; }

            prijavljeniVrtic = vrtici.find(v => v.id === vrticId);
            prijavljeni = prijavljeniVrtic.odgajatelji.find(o => o.id === odgId);

            document.getElementById('login-card').style.display = 'none';
            document.getElementById('app').style.display = 'block';

            document.getElementById('avatar').textContent = prijavljeni.ime[0] + prijavljeni.prezime[0];
            document.getElementById('user-ime').textContent = `${prijavljeni.ime} ${prijavljeni.prezime}`;
            document.getElementById('user-detalji').textContent = `${prijavljeni.radnoMjesto} · ${prijavljeniVrtic.naziv}`;

            document.getElementById('mjesec').addEventListener('change', renderTablica);
            renderTablica();
            renderGalerija();
        }

        function odjava() {
            prijavljeni = null;
            prijavljeniVrtic = null;
            document.getElementById('app').style.display = 'none';
            document.getElementById('login-card').style.display = 'block';
        }

        function renderTablica() {
            const podaci = ucitajPodatkeKorisnika(prijavljeni.id);

            let thead = '<tr><th>Dan →</th>';
            for (let d = 1; d <= 31; d++) thead += `<th>${d}</th>`;
            thead += '</tr>';
            document.getElementById('thead').innerHTML = thead;

            let dolazakCells = '';
            let odlazakCells = '';
            for (let d = 0; d < 31; d++) {
                dolazakCells += cellHtml(podaci.dolasci[d] || '', d, 'dolazak');
                odlazakCells += cellHtml(podaci.odlasci[d] || '', d, 'odlazak');
            }

            document.getElementById('tbody').innerHTML = `
                <tr><td class="row-label" style="color:#2ed573;">Dolazak</td>${dolazakCells}</tr>
                <tr style="border-bottom:2px solid #ccc;"><td class="row-label" style="color:#e94560;">Odlazak</td>${odlazakCells}</tr>
            `;
        }

        function cellHtml(val, danIndex, vrsta) {
            const prikaz = val ? val : '·';
            let klasa = 'vrijeme-cell ';
            if (val === '-') klasa += 'odsutan';
            else if (val) klasa += 'ima';
            else klasa += 'prazno';
            return `<td><span class="${klasa}" onclick="unesiVrijeme(${danIndex}, '${vrsta}')">${prikaz}</span></td>`;
        }

        function formatirajVrijeme(unos) {
            let broj = unos.replace(/\D/g, '');
            if (broj.length === 0) return null;
            if (broj.length === 1) broj = '0' + broj + '00';
            else if (broj.length === 2) broj = broj + '00';
            else if (broj.length === 3) broj = '0' + broj;
            broj = broj.slice(0, 4);
            let sati = parseInt(broj.slice(0, 2), 10);
            let minute = parseInt(broj.slice(2, 4), 10);
            if (sati > 23) sati = 23;
            if (minute > 59) minute = 59;
            return String(sati).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
        }

        function unesiVrijeme(danIndex, vrsta) {
            const podaci = ucitajPodatkeKorisnika(prijavljeni.id);
            const polje = vrsta === 'odlazak' ? 'odlasci' : 'dolasci';
            const trenutno = podaci[polje][danIndex];
            const naziv = vrsta === 'odlazak' ? 'odlaska' : 'dolaska';
            const unos = prompt(`Unesite vrijeme ${naziv} (npr. 730 → 07:30). Prazno = "-" (odsutan), "x" = brisanje:`, trenutno && trenutno !== '-' ? trenutno : '');
            if (unos === null) return;
            const v = unos.trim();
            if (v === '') podaci[polje][danIndex] = '-';
            else if (v.toLowerCase() === 'x') podaci[polje][danIndex] = '';
            else podaci[polje][danIndex] = formatirajVrijeme(v) || '-';
            spremiPodatkeKorisnika(prijavljeni.id, podaci);
            renderTablica();
        }

        // Fotografije po korisniku
        function kljucFotografija(odgId) { return `fotografije_odg_${odgId}`; }

        function ucitajFotoIzMemorije() {
            const spremljeno = localStorage.getItem(kljucFotografija(prijavljeni.id));
            return spremljeno ? JSON.parse(spremljeno) : [];
        }

        function spremiFoto(slike) {
            localStorage.setItem(kljucFotografija(prijavljeni.id), JSON.stringify(slike));
        }

        function ucitajFotografije(event) {
            const datoteke = event.target.files;
            if (!datoteke || datoteke.length === 0) return;
            const slike = ucitajFotoIzMemorije();

            let ucitano = 0;
            const ukupno = datoteke.length;
            for (let i = 0; i < ukupno; i++) {
                const file = datoteke[i];
                if (!file.type.startsWith('image/')) { ucitano++; continue; }
                const reader = new FileReader();
                reader.onload = function(e) {
                    slike.push({ src: e.target.result, naziv: file.name });
                    ucitano++;
                    if (ucitano === ukupno) { spremiFoto(slike); renderGalerija(); }
                };
                reader.readAsDataURL(file);
            }
        }

        function obrisiFoto(index) {
            if (!confirm('Obrisati fotografiju?')) return;
            const slike = ucitajFotoIzMemorije();
            slike.splice(index, 1);
            spremiFoto(slike);
            renderGalerija();
        }

        function renderGalerija() {
            const galerija = document.getElementById('galerija');
            const slike = ucitajFotoIzMemorije();
            if (slike.length === 0) {
                galerija.innerHTML = '<p style="color:#999; grid-column:1/-1; text-align:center; padding:20px;">Još nema učitanih fotografija.</p>';
                return;
            }
            galerija.innerHTML = slike.map((s, i) => `
                <div style="border:1px solid #eee; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08); position:relative;">
                    <img src="${s.src}" style="width:100%; height:130px; object-fit:cover; display:block;">
                    <div style="padding:8px; font-size:0.75rem; color:#666; text-align:center;">${s.naziv}</div>
                    <button onclick="obrisiFoto(${i})" style="position:absolute; top:6px; right:6px; background:#ff4757; color:white; border:none; border-radius:50%; width:26px; height:26px; cursor:pointer; font-weight:700;">✕</button>
                </div>
            `).join('');
        }

        initPrijava();
    </script>
</body>
</html>
